name: Barridos automaticos

on:
  schedule:
    # Corre cada 15 min todo el dia; el backend decide si a esta hora exacta
    # (hora Colombia) le toca ejecutar de verdad, segun las horas que el
    # administrador configuro en Usuarios Autorizados > Barridos -- por eso
    # ya no hay horas fijas aqui, GitHub solo "toca la puerta" seguido.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  deteccion-entregas:
    runs-on: ubuntu-latest
    steps:
      - name: Barrido de deteccion de entregas (avanza el flujo si llego el correo)
        run: |
          curl -sf -X GET "https://seguimiento-informes.vercel.app/api/reports" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  recordatorios-alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Envio de recordatorios de alertas vencidas
        run: |
          curl -sf -X GET "https://seguimiento-informes.vercel.app/api/alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  # Importacion del cronograma de Seguimiento desde Google Sheets: ya no
  # corre sola -- solo manual, desde el boton "Ejecutar ahora" en Usuarios
  # Autorizados > Barridos, o disparando este workflow a mano.
  importacion-cronograma:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Reimportar el cronograma de Seguimiento desde Google Sheets
        run: |
          curl -sf -X GET "https://seguimiento-informes.vercel.app/api/projects" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
