name: Barridos automaticos

on:
  schedule:
    # Deteccion de entregas por correo: solo 3 veces al dia, hora Colombia
    # (UTC-5) -- 8:00am, 1:00pm y 6:00pm -- en vez de cada 2 horas, para
    # bajar aun mas el consumo de compute en Neon.
    - cron: '0 13 * * *' # 8:00am Colombia
    - cron: '0 18 * * *' # 1:00pm Colombia
    - cron: '0 23 * * *' # 6:00pm Colombia
  workflow_dispatch:

jobs:
  deteccion-entregas:
    if: >
      github.event.schedule == '0 13 * * *' ||
      github.event.schedule == '0 18 * * *' ||
      github.event.schedule == '0 23 * * *' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Barrido de deteccion de entregas (avanza el flujo si llego el correo)
        run: |
          curl -sf -X GET "https://seguimiento-informes.vercel.app/api/reports" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  recordatorios-alertas:
    # Se aprovecha el mismo disparo de las 8:00am para no sumar un cron mas.
    if: github.event.schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Envio de recordatorios de alertas vencidas
        run: |
          curl -sf -X GET "https://seguimiento-informes.vercel.app/api/alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  # Importacion del cronograma de Seguimiento desde Google Sheets: ya no
  # corre sola -- solo manual, desde el boton "Ejecutar ahora" en Usuarios
  # Autorizados > Barridos, o disparando este workflow a mano.
  importacion-cronograma:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Reimportar el cronograma de Seguimiento desde Google Sheets
        run: |
          curl -sf -X GET "https://seguimiento-informes.vercel.app/api/projects" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
